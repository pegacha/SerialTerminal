[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SerialTerminal"
version = "0.1.0"
description = "TUI Serial terminal"
requires-python = ">=3.10"  # PEP 604 unions (Path | None) are evaluated at def time
dependencies = [
    "textual>=0.47.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "textual-fspicker>=0.0.5"
]

[project.scripts]
serialterminal = "main:main"

[tool.setuptools]
packages = [
    "ui",
    "serial_comm",
    "utils",
]